# BerryCast : tampon de réception réseau (UDP) plus grand.
# La vidéo Miracast arrive en UDP (pas de renvoi des morceaux perdus) ; une image complète
# fait des centaines de Ko et arrive d'un bloc. Par défaut, Linux limite le tampon d'un
# programme non-root à ~200 Ko : des morceaux étaient perdus et l'image jamais complète.
net.core.rmem_max = 8388608
