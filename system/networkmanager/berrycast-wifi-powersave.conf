# BerryCast : économie d'énergie du Wi-Fi désactivée (valeur par défaut des connexions).
# Constaté sur le Pi 3 : avec l'économie d'énergie, la puce s'endort entre deux paquets ;
# des morceaux de la vidéo Miracast (UDP, sans renvoi) se perdaient : petits gels par zone.
# 2 = désactivée (1 = laisser le pilote décider, 3 = activée).
# Pris en compte à chaque connexion Wi-Fi (donc après redémarrage).
[connection]
wifi.powersave = 2
