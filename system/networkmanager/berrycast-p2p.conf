# BerryCast : NetworkManager ne doit pas toucher aux interfaces des groupes Wi-Fi Direct
# créés par le service Miracast (p2p-wlan0-0…) : c'est lui qui leur donne une adresse.
# Le Wi-Fi de la maison (wlan0) n'est pas concerné.
# Installé dans /etc/NetworkManager/conf.d/.
[keyfile]
unmanaged-devices=interface-name:p2p-wlan0-*
