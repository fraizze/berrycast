# BerryCast : portail captif du mode configuration.
# Installé dans /etc/NetworkManager/dnsmasq-shared.d/ : ne concerne QUE les connexions
# NetworkManager en mode « partagé », c'est-à-dire le Wi-Fi temporaire BerryCast-Setup.
# Tous les noms de domaine (captive.apple.com, connectivitycheck.gstatic.com…)
# répondent 10.42.0.1 : le téléphone détecte un portail et ouvre la page tout seul.
address=/#/10.42.0.1
