<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>BerryCast : configuration</title>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #a8a8a8;
    --line: #3a3a3a;
    --field: #141414;
    --ok: #7ee2a8;
    --err: #ff8a80;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 18px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 16px 32px;
  }
  main { width: 100%; max-width: 420px; }
  h1 { font-size: 28px; font-weight: 700; margin: 8px 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .step { color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  label { display: block; font-weight: 600; margin-bottom: 10px; }
  .hint { color: var(--muted); font-size: 15px; margin: -4px 0 14px; }
  input.code {
    width: 100%;
    font: 600 34px/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: 0.35em;
    text-align: center;
    padding: 16px 8px 16px calc(8px + 0.35em);
    color: var(--fg);
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    outline: none;
  }
  input.code:focus { border-color: var(--fg); }
  button {
    width: 100%;
    margin-top: 18px;
    padding: 16px;
    font: 600 18px/1 inherit;
    color: var(--bg);
    background: var(--fg);
    border: 0;
    border-radius: var(--radius);
    cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: default; }
  .msg { min-height: 1.5em; margin-top: 14px; font-size: 16px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .done { text-align: center; padding: 32px 0; }
  .done .check { font-size: 56px; color: var(--ok); line-height: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Bienvenue sur BerryCast</h1>
  <p class="sub" id="device">Configuration de votre écran sans fil</p>

  <section id="step-code">
    <div class="step">Étape 1</div>
    <label for="code">Code affiché sur la TV</label>
    <p class="hint">6 chiffres, en bas de l'écran de la TV.</p>
    <form id="code-form" autocomplete="off">
      <input id="code" class="code" inputmode="numeric" pattern="[0-9 ]*"
             maxlength="7" autocomplete="one-time-code" placeholder="••• •••" required>
      <button id="code-btn" type="submit" disabled>Continuer</button>
    </form>
    <div id="code-msg" class="msg" role="status" aria-live="polite"></div>
  </section>

  <section id="step-next" hidden>
    <div class="done">
      <div class="check">✓</div>
      <p><strong>Code correct.</strong></p>
      <p class="sub">La suite (nom de l'appareil, Wi-Fi, pays…) arrive à la prochaine étape du développement.</p>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";
  var input = document.getElementById("code");
  var button = document.getElementById("code-btn");
  var msg = document.getElementById("code-msg");
  var lockTimer = null;

  function digits() { return input.value.replace(/\D/g, ""); }

  function setMsg(text, kind) {
    msg.textContent = text;
    msg.className = "msg" + (kind ? " " + kind : "");
  }

  function lock(seconds) {
    input.disabled = true;
    button.disabled = true;
    clearInterval(lockTimer);
    var left = seconds;
    setMsg("Trop d'essais. Réessayez dans " + left + " s.", "err");
    lockTimer = setInterval(function () {
      left -= 1;
      if (left <= 0) {
        clearInterval(lockTimer);
        input.disabled = false;
        input.value = "";
        setMsg("");
        input.focus();
      } else {
        setMsg("Trop d'essais. Réessayez dans " + left + " s.", "err");
      }
    }, 1000);
  }

  input.addEventListener("input", function () {
    var d = digits().slice(0, 6);
    input.value = d.length > 3 ? d.slice(0, 3) + " " + d.slice(3) : d;
    button.disabled = d.length !== 6;
  });

  document.getElementById("code-form").addEventListener("submit", function (e) {
    e.preventDefault();
    if (digits().length !== 6) return;
    button.disabled = true;
    setMsg("Vérification…");
    fetch("/api/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: digits() })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res.ok) {
          sessionStorage.setItem("berrycast-token", res.token);
          document.getElementById("step-code").hidden = true;
          document.getElementById("step-next").hidden = false;
        } else if (res.locked_seconds) {
          lock(res.locked_seconds);
        } else {
          setMsg("Code incorrect. Encore " + res.remaining + " essai" + (res.remaining > 1 ? "s" : "") + ".", "err");
          input.value = "";
          input.focus();
        }
      })
      .catch(function () {
        setMsg("Le Raspberry Pi ne répond pas. Êtes-vous toujours sur le Wi-Fi BerryCast-Setup ?", "err");
        button.disabled = false;
      });
  });

  fetch("/api/info").then(function (r) { return r.json(); }).then(function (info) {
    if (info.ssid) document.getElementById("device").textContent = "Vous êtes connecté à " + info.ssid;
    if (info.locked_seconds) lock(info.locked_seconds);
  }).catch(function () {});

  input.focus();
})();
</script>
</body>
</html>
